<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestOdonto — Mapa Estratégico Interno</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a18;
      --surface: #142623;
      --surface-2: #1b302b;
      --ink: #ede9e0;
      --ink-soft: #a7b3ae;
      --ink-faint: #74847f;
      --border: #2a3e39;
      --accent: #3ecdb1;
      --accent-ink: #06231f;
      --accent-soft: #16332d;
      --gold: #e3ac5c;
      --gold-soft: #2c2314;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a18;
    --surface: #142623;
    --surface-2: #1b302b;
    --ink: #ede9e0;
    --ink-soft: #a7b3ae;
    --ink-faint: #74847f;
    --border: #2a3e39;
    --accent: #3ecdb1;
    --accent-ink: #06231f;
    --accent-soft: #16332d;
    --gold: #e3ac5c;
    --gold-soft: #2c2314;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --surface-2: #efeade;
    --ink: #16211f;
    --ink-soft: #45524d;
    --ink-faint: #7c8985;
    --border: #ddd6c5;
    --accent: #0f7a6b;
    --accent-ink: #ffffff;
    --accent-soft: #e2f0ec;
    --gold: #ad7b34;
    --gold-soft: #f3e6cd;
    --shadow: 0 1px 2px rgba(30,25,10,.05), 0 10px 28px rgba(30,25,10,.07);

    --font-display: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --font-body: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color-scheme: light dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
  }
  html { scroll-behavior: smooth; }

  h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
  p { margin: 0; }
  a { color: inherit; }

  .eyebrow {
    font-family: var(--font-body);
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 1.75rem; }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 1.75rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 3.6rem; gap: 1rem;
  }
  .brand { display: flex; align-items: baseline; gap: .5rem; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
  .brand .tag { font-family: var(--font-body); font-size: .68rem; color: var(--ink-faint); font-weight: 400; }
  .nav-links { display: flex; gap: 1.4rem; font-size: .85rem; }
  .nav-links a { text-decoration: none; color: var(--ink-soft); }
  .nav-links a:hover { color: var(--accent); }
  .nav-toggle-input { display: none; }
  .nav-toggle-btn { display: none; cursor: pointer; font-size: 1.4rem; line-height: 1; padding: .3rem .1rem; user-select: none; }
  @media (max-width: 640px) {
    .nav-inner { position: relative; }
    .nav-toggle-btn { display: block; }
    .nav-links {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; gap: 0; background: var(--bg); border-bottom: 1px solid var(--border);
      padding: .3rem 1.75rem 1rem; box-shadow: var(--shadow);
    }
    .nav-links a { padding: .65rem 0; border-bottom: 1px dashed var(--border); }
    .nav-links a:last-child { border-bottom: none; }
    .nav-toggle-input:checked ~ .nav-links { display: flex; }
  }

  /* ---------- Hero ---------- */
  .hero { padding: 4.5rem 0 3rem; }
  .hero h1 { font-size: clamp(2.1rem, 5vw, 3rem); margin-top: .5rem; }
  .hero .sub { color: var(--ink-soft); font-size: 1.1rem; max-width: 62ch; margin-top: 1rem; }

  .notice {
    margin-top: 2rem;
    background: var(--gold-soft);
    border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--border));
    border-radius: 10px;
    padding: 1rem 1.25rem;
    font-size: .9rem;
    color: var(--ink);
    max-width: 72ch;
  }
  .notice b { color: var(--gold); }

  .pvvp-grid {
    margin-top: 2.5rem;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
  @media (max-width: 720px) { .pvvp-grid { grid-template-columns: 1fr; } }
  .pvvp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.5rem;
    box-shadow: var(--shadow);
  }
  .pvvp-card h3 { font-size: 1.05rem; color: var(--accent); margin-bottom: .5rem; }
  .pvvp-card p { color: var(--ink-soft); font-size: .95rem; }

  .values-list { margin-top: 1rem; display: grid; gap: .9rem; }
  .value-row { display: grid; grid-template-columns: 1.6rem 1fr; gap: .6rem; align-items: baseline; }
  .value-row .n { font-family: var(--font-display); color: var(--accent); font-weight: 700; }
  .value-row b { color: var(--ink); }
  .value-row span.d { color: var(--ink-soft); }

  /* ---------- Sections ---------- */
  section { padding: 4rem 0; border-top: 1px solid var(--border); }
  .section-head { max-width: 68ch; margin-bottom: 2.2rem; }
  .section-head h2 { font-size: clamp(1.5rem, 3vw, 2rem); margin-top: .4rem; }
  .section-head p { color: var(--ink-soft); margin-top: .7rem; }

  /* ---------- Legend / phase pills ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; margin: 1.4rem 0 1.8rem; font-size: .85rem; color: var(--ink-soft); }
  .legend .item { display: flex; align-items: center; gap: .45rem; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-body); font-weight: 700; font-size: .68rem; letter-spacing: .03em;
    padding: .12rem .5rem; border-radius: 999px; line-height: 1.7;
  }
  .pill-f1 { background: var(--accent); color: var(--accent-ink); }
  .pill-f2 { background: transparent; color: var(--gold); border: 1.5px solid var(--gold); }
  .pill-f3 { background: transparent; color: var(--ink-faint); border: 1.5px solid var(--border); }

  /* ---------- Org chart figure ---------- */
  figure.chart { margin: 0; }
  figure.chart svg { max-width: 100%; height: auto; display: block; }
  figcaption {
    margin-top: 1rem; font-size: .85rem; color: var(--ink-faint); max-width: 60ch;
  }
  .org-box rect { fill: var(--surface); stroke: var(--border); }
  .org-box.root rect { fill: var(--accent); stroke: var(--accent); }
  .org-box.root text.t1 { fill: var(--accent-ink); }
  .org-box.root text.t2 { fill: var(--accent-ink); opacity: .85; }
  .org-box text.t1 { fill: var(--ink); font-weight: 700; }
  .org-box text.t2 { fill: var(--ink-soft); }
  .org-line { stroke: var(--ink-faint); stroke-width: 1.4; fill: none; }
  .org-pill-bg { fill: var(--bg); }

  /* ---------- Departments (accordions) ---------- */
  .dept { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); margin-bottom: .9rem; overflow: clip; }
  .dept summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1.1rem 1.4rem;
  }
  .dept summary::-webkit-details-marker { display: none; }
  .dept summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dept-head-l { display: flex; align-items: baseline; gap: .8rem; }
  .dept-head-l .num { font-family: var(--font-display); color: var(--accent-soft-ink, var(--accent)); font-size: 1rem; color: var(--accent); }
  .dept-head-l h3 { font-size: 1.15rem; }
  .dept-head-r { display: flex; align-items: center; gap: .6rem; }
  .chev { transition: transform .15s ease; color: var(--ink-faint); }
  details[open] .chev { transform: rotate(90deg); }
  .dept-body { padding: 0 1.4rem 1.5rem; border-top: 1px solid var(--border); }
  .dept-cols { display: grid; grid-template-columns: 1.15fr .85fr; gap: 2rem; margin-top: 1.2rem; }
  @media (max-width: 780px) { .dept-cols { grid-template-columns: 1fr; } }
  .colhead { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; margin-bottom: .8rem; }
  .role { display: grid; grid-template-columns: 1fr auto; gap: .3rem 1rem; padding: .6rem 0; border-bottom: 1px dashed var(--border); }
  .role:last-child { border-bottom: none; }
  .role .name { font-weight: 600; }
  .role .fn { color: var(--ink-soft); font-size: .88rem; grid-column: 1 / -1; }
  .routine { display: grid; grid-template-columns: 6.4rem 1fr; gap: .8rem; padding: .55rem 0; border-bottom: 1px dashed var(--border); font-size: .9rem; }
  .routine:last-child { border-bottom: none; }
  @media (max-width: 480px) { .routine { grid-template-columns: 1fr; gap: .15rem; } }
  .routine .cad { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .routine .txt { color: var(--ink-soft); }

  /* ---------- Roadmap ---------- */
  .roadmap-table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-top: 2.4rem; }
  .roadmap-table th, .roadmap-table td { text-align: left; padding: .7rem .8rem; border-bottom: 1px solid var(--border); }
  .roadmap-table th { color: var(--ink-faint); font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  .roadmap-table td.num, .roadmap-table th.num { font-variant-numeric: tabular-nums; text-align: right; }
  .roadmap-table tbody tr:hover { background: var(--surface-2); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  .table-wrap .roadmap-table { margin-top: 0; }
  .table-wrap .roadmap-table th:first-child, .table-wrap .roadmap-table td:first-child { padding-left: 1.2rem; }

  .chart-arr { stroke: var(--accent); stroke-width: 2.5; fill: none; }
  .chart-area { fill: var(--accent); opacity: .12; }
  .chart-grid { stroke: var(--border); stroke-width: 1; }
  .chart-dot { fill: var(--accent); }
  .chart-dot.end { fill: var(--gold); }
  .chart-label { fill: var(--ink); font-weight: 700; }
  .chart-year { fill: var(--ink-faint); }

  .milestones { display: grid; gap: 1rem; margin-top: 2.4rem; }
  .milestone { display: grid; grid-template-columns: 4.2rem 1fr; gap: 1.1rem; align-items: start; }
  .milestone .yr { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--accent); }
  .milestone .body b { display: block; margin-bottom: .2rem; }
  .milestone .body span { color: var(--ink-soft); font-size: .92rem; }

  /* ---------- Checklist ---------- */
  .overall-progress {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.4rem; box-shadow: var(--shadow); margin-bottom: 1.8rem;
    display: flex; flex-direction: column; gap: .6rem;
  }
  .overall-progress .row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .overall-progress .label { font-size: .85rem; color: var(--ink-soft); }
  .overall-progress .pct { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .bar-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width .25s ease; border-radius: 999px; }
  @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

  .grp { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); margin-bottom: .9rem; overflow: clip; }
  .grp summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1.1rem 1.4rem;
  }
  .grp summary::-webkit-details-marker { display: none; }
  .grp summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .grp-head-l { display: flex; align-items: baseline; gap: .8rem; }
  .grp-head-l .letter { font-family: var(--font-display); color: var(--accent); font-size: 1rem; font-weight: 700; }
  .grp-head-l h3 { font-size: 1.1rem; }
  .grp-head-r { display: flex; align-items: center; gap: .7rem; }
  .grp-count {
    font-size: .78rem; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums;
    border: 1px solid var(--border); border-radius: 999px; padding: .12rem .6rem;
  }
  .grp-body { padding: .3rem 1.4rem 1.3rem; border-top: 1px solid var(--border); }
  .chk-item { display: flex; align-items: flex-start; gap: .7rem; padding: .65rem 0; border-bottom: 1px dashed var(--border); }
  .chk-item:last-child { border-bottom: none; }
  .chk-item input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 1.15rem; height: 1.15rem; flex: 0 0 auto;
    margin-top: .15rem; border: 1.5px solid var(--border); border-radius: 5px; background: var(--surface);
    cursor: pointer; position: relative;
  }
  .chk-item input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .chk-item input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 3px; top: -1px; width: 5px; height: 9px;
    border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .chk-item input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chk-item label { cursor: pointer; font-size: .95rem; }
  .chk-item.done label { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--border); }
  .checklist-note { font-size: .82rem; color: var(--ink-faint); margin-top: 1.4rem; max-width: 62ch; }

  /* ---------- Marketing / content calendar ---------- */
  .pillar-legend { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.2rem 0 2rem; }
  .pillar-chip {
    font-size: .78rem; padding: .3rem .75rem; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--border);
  }
  .cadence-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.2rem 1.4rem; box-shadow: var(--shadow); margin-bottom: 2rem;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem;
  }
  @media (max-width: 720px) { .cadence-card { grid-template-columns: 1fr; } }
  .cadence-card .ck { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; margin-bottom: .35rem; }
  .cadence-card .cv { font-size: .95rem; color: var(--ink); }

  .pill-carrossel { background: var(--accent-soft); color: var(--accent); border: none; font-weight: 700; font-size: .7rem; padding: .15rem .55rem; border-radius: 999px; }
  .pill-video { background: var(--gold-soft); color: var(--gold); border: none; font-weight: 700; font-size: .7rem; padding: .15rem .55rem; border-radius: 999px; }

  .week-count { font-size: .78rem; font-weight: 700; color: var(--ink-soft); }

  .post-card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.15rem; margin: .8rem 0; background: var(--surface-2); }
  .post-head { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .post-num { font-family: var(--font-display); font-weight: 800; color: var(--ink-faint); font-size: .85rem; }
  .post-pillar { font-size: .78rem; color: var(--ink-faint); }
  .post-hook { font-size: 1.02rem; margin: .3rem 0 .7rem; }
  .script-row { display: grid; grid-template-columns: 8.5rem 1fr; gap: .6rem; font-size: .89rem; padding: .35rem 0; border-bottom: 1px dashed var(--border); }
  .script-row:last-of-type { border-bottom: none; }
  @media (max-width: 640px) { .script-row { grid-template-columns: 1fr; gap: .15rem; } }
  .script-row b { color: var(--ink-soft); font-weight: 700; }
  .script-row span { color: var(--ink); }
  .post-caption { margin-top: .7rem; font-size: .86rem; color: var(--ink-soft); background: var(--surface); border-radius: 8px; padding: .6rem .8rem; border: 1px solid var(--border); }
  .post-caption b { color: var(--ink); }

  footer { padding: 2.6rem 0 4rem; border-top: 1px solid var(--border); }
  footer p { color: var(--ink-faint); font-size: .82rem; max-width: 60ch; }
  footer .conf { color: var(--gold); font-weight: 700; }

  /* ---------- Login (acesso restrito) ---------- */
  .login-wrap { max-width: 360px; margin: 6rem auto; padding: 0 1.5rem; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.6rem; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  .login-card .sub { color: var(--ink-faint); font-size: .85rem; margin-bottom: 1.4rem; }
  .login-card label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin-bottom: .4rem; }
  .login-card input[type="password"] { width: 100%; padding: .65rem .7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--ink); font-family: inherit; font-size: .95rem; }
  .login-card button { cursor: pointer; border: none; border-radius: 8px; padding: .7rem 1.1rem; font-family: inherit; font-weight: 700; font-size: .9rem; background: var(--accent); color: var(--accent-ink); margin-top: 1.1rem; width: 100%; }
  .login-card .msg { margin-top: 1rem; font-size: .85rem; padding: .65rem .85rem; border-radius: 8px; background: #f7e3de; color: #b3432f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-card .msg { background: #3a231d; color: #e08a72; } }
  :root[data-theme="dark"] .login-card .msg { background: #3a231d; color: #e08a72; }
</style>
</head>
<body>

<div class="login-wrap">
  <div id="login" class="login-card">
    <h1>🦷 GestOdonto</h1>
    <div class="sub">Mapa estratégico interno — acesso restrito aos sócios.</div>
    <label for="pwd">Senha</label>
    <input type="password" id="pwd" placeholder="••••••••">
    <button id="loginBtn">Entrar</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="content" style="display:none"></div>

<script>
(function () {
  var TOKEN_KEY = 'gestodonto_admin_token';
  var loginWrapEl = document.querySelector('.login-wrap');
  var contentEl = document.getElementById('content');
  var pwdEl = document.getElementById('pwd');
  var loginMsgEl = document.getElementById('loginMsg');

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  function showLogin(msg) {
    loginWrapEl.style.display = 'block';
    contentEl.style.display = 'none';
    loginMsgEl.innerHTML = msg ? ('<div class="msg">' + msg + '</div>') : '';
  }

  function initChecklist() {
    var boxes = Array.prototype.slice.call(document.querySelectorAll('.checklist input[type="checkbox"]'));
    if (!boxes.length) return;
    var API = '/api/checklist';
    var POLL_MS = 15000;
    var pending = {}; // ids com POST em andamento — não deixa o polling sobrescrever o clique

    function updateProgress() {
      var groups = {};
      var totalDone = 0;
      boxes.forEach(function (b) {
        var g = b.dataset.group;
        if (!groups[g]) groups[g] = { done: 0, total: 0 };
        groups[g].total++;
        if (b.checked) { groups[g].done++; totalDone++; }
        var item = b.closest('.chk-item');
        if (item) item.classList.toggle('done', b.checked);
      });
      document.querySelectorAll('[data-group-progress]').forEach(function (el) {
        var g = el.getAttribute('data-group-progress');
        var d = groups[g] || { done: 0, total: 0 };
        el.textContent = d.done + '/' + d.total;
      });
      var total = boxes.length;
      var pct = total ? Math.round((totalDone / total) * 100) : 0;
      var bar = document.getElementById('overall-bar');
      var label = document.getElementById('overall-label');
      if (bar) bar.style.width = pct + '%';
      if (label) label.textContent = totalDone + '/' + total + ' concluído (' + pct + '%)';
    }

    function applyState(state) {
      boxes.forEach(function (b) {
        if (pending[b.id]) return;
        var val = !!state[b.id];
        if (b.checked !== val) b.checked = val;
      });
      updateProgress();
    }

    function loadState() {
      fetch(API, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(applyState)
        .catch(function () {});
    }

    boxes.forEach(function (b) {
      b.addEventListener('change', function () {
        var checked = b.checked;
        pending[b.id] = true;
        updateProgress();
        fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: b.id, checked: checked })
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (state) {
            delete pending[b.id];
            if (state) applyState(state);
          })
          .catch(function () {
            delete pending[b.id];
            b.checked = !checked;
            updateProgress();
          });
      });
    });

    updateProgress();
    loadState();
    setInterval(loadState, POLL_MS);
  }

  function boot() {
    var token = getToken();
    if (!token) { showLogin(); return; }
    fetch('/api/strategic-content', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { clearToken(); throw new Error('Sessão expirada ou inválida. Faça login novamente.'); }
        return r.text();
      })
      .then(function (html) {
        contentEl.innerHTML = html;
        loginWrapEl.style.display = 'none';
        contentEl.style.display = 'block';
        initChecklist();
        var navToggle = document.getElementById('nav-toggle');
        if (navToggle) {
          contentEl.querySelectorAll('.nav-links a').forEach(function (a) {
            a.addEventListener('click', function () { navToggle.checked = false; });
          });
        }
      })
      .catch(function (e) { showLogin(e.message); });
  }

  document.getElementById('loginBtn').addEventListener('click', function () {
    var password = pwdEl.value;
    loginMsgEl.innerHTML = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || 'Falha no login.');
        setToken(result.data.token);
        boot();
      })
      .catch(function (e) { loginMsgEl.innerHTML = '<div class="msg">' + e.message + '</div>'; });
  });

  pwdEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  boot();
})();
</script>
</body>
</html>
