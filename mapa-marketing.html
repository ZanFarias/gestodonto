<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestOdonto — Mapa de Marketing</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'loose' });
  window.mermaid = mermaid;
</script>
<style>
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a18;
      --surface: #142623;
      --surface-2: #1b302b;
      --ink: #ede9e0;
      --ink-soft: #a7b3ae;
      --ink-faint: #74847f;
      --border: #2a3e39;
      --accent: #3ecdb1;
      --accent-ink: #06231f;
      --accent-soft: #16332d;
      --gold: #e3ac5c;
      --gold-soft: #2c2314;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a18;
    --surface: #142623;
    --surface-2: #1b302b;
    --ink: #ede9e0;
    --ink-soft: #a7b3ae;
    --ink-faint: #74847f;
    --border: #2a3e39;
    --accent: #3ecdb1;
    --accent-ink: #06231f;
    --accent-soft: #16332d;
    --gold: #e3ac5c;
    --gold-soft: #2c2314;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --surface-2: #efeade;
    --ink: #16211f;
    --ink-soft: #45524d;
    --ink-faint: #7c8985;
    --border: #ddd6c5;
    --accent: #0f7a6b;
    --accent-ink: #ffffff;
    --accent-soft: #e2f0ec;
    --gold: #ad7b34;
    --gold-soft: #f3e6cd;
    --shadow: 0 1px 2px rgba(30,25,10,.05), 0 10px 28px rgba(30,25,10,.07);
    --font-display: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --font-body: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color-scheme: light dark;
  }

  *{box-sizing:border-box;}
  html, body { margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
  }
  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important; transition:none !important;} }

  a{color:inherit;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0;}
  p{margin:0 0 0.7em; max-width:66ch;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,48px);}

  /* ---------- Nav ---------- */
  .nav{ position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .nav-inner{ max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,48px); display:flex; align-items:center; justify-content:space-between; height:3.6rem; gap:1rem; }
  .brand{ display:flex; align-items:baseline; gap:.5rem; font-family:var(--font-display); font-weight:700; font-size:1.05rem; }
  .brand .tag{ font-family:var(--font-body); font-size:.68rem; color:var(--ink-faint); font-weight:400; }
  .nav-links{ display:flex; gap:1.4rem; font-size:.85rem; }
  .nav-links a{ text-decoration:none; color:var(--ink-soft); }
  .nav-links a:hover{ color:var(--accent); }

  /* ---------- Masthead ---------- */
  .masthead{ border-bottom:1px solid var(--border); padding:32px 0 24px; background:var(--bg); }
  .masthead-grid{ display:grid; grid-template-columns:1fr auto; gap:20px; align-items:end; }
  .eyebrow{
    font-family:var(--font-body); font-weight:700; font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--accent); display:flex; gap:9px; align-items:center; margin-bottom:12px;
  }
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block;}
  h1.title{ font-family:var(--font-display); font-weight:800; font-size:clamp(2rem,4.4vw,3rem); letter-spacing:-0.015em; color:var(--ink); }
  .subtitle{ color:var(--ink-soft); font-weight:400; font-size:1.05rem; margin-top:10px; max-width:54ch; }
  .stamp{
    border:1px solid var(--border); border-radius:12px; padding:12px 18px; text-align:right;
    font-size:0.72rem; color:var(--ink-soft); line-height:1.75; white-space:nowrap; background:var(--surface); box-shadow:var(--shadow);
  }
  .stamp b{color:var(--accent); font-size:0.78rem; letter-spacing:0.04em;}
  .stats-row{ display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--border); margin-top:24px; }
  .stat{ flex:1 1 140px; padding:14px 18px 4px 0; border-right:1px solid var(--border); }
  .stat:last-child{border-right:none;}
  .stat .n{ font-family:var(--font-display); font-variant-numeric:tabular-nums; font-size:1.6rem; font-weight:800; color:var(--accent); display:block; }
  .stat .l{ font-size:0.72rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; }

  /* ---------- Layout: sidebar + content ---------- */
  .layout{display:grid; grid-template-columns:240px 1fr; gap:44px; padding:36px 0 80px; align-items:start;}
  @media (max-width: 880px){ .layout{grid-template-columns:1fr;} .sidebar{position:static !important; order:2;} }
  .sidebar{position:sticky; top:4.4rem; align-self:start;}
  .sidebar nav{display:flex; flex-direction:column; gap:2px;}
  .sidebar a{ display:flex; gap:10px; align-items:baseline; text-decoration:none; color:var(--ink-soft); font-family:var(--font-display); font-size:0.86rem; font-weight:600; padding:7px 9px; border-radius:6px; border-left:2px solid transparent; }
  .sidebar a:hover{background:var(--accent-soft); color:var(--accent); border-left-color:var(--accent);}
  .sidebar a .rn{color:var(--accent); font-weight:700; font-size:0.78rem;}
  .search-box{margin-bottom:18px;}
  .search-box input{ width:100%; padding:10px 12px; font-family:var(--font-body); font-size:0.85rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); }
  .search-box input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .search-box .hint{font-size:0.68rem; color:var(--ink-faint); margin-top:5px;}
  main{min-width:0;}

  /* ---------- Method legend ---------- */
  .legend{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; margin-bottom:44px; box-shadow:var(--shadow); }
  .legend h2{font-size:1rem; margin-bottom:10px;}
  .legend-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 16px; margin-top:12px; }
  .legend-item{font-size:0.82rem;}
  .legend-item b{ display:block; font-size:0.7rem; color:var(--accent); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:2px; font-weight:700; }
  .legend-item span{color:var(--ink-soft);}

  /* ---------- Blocks ---------- */
  .block{margin-bottom:64px; scroll-margin-top:5rem;}
  .block-head{ display:flex; gap:16px; align-items:baseline; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:14px; }
  .block-num{ font-family:var(--font-display); font-size:1.6rem; font-weight:800; color:var(--accent); min-width:2.2ch; }
  .block-head h2{font-size:clamp(1.3rem,2.4vw,1.7rem);}
  .block-why{color:var(--ink-soft); font-size:0.95rem; margin-bottom:22px; max-width:74ch;}

  /* ---------- Tree (details) ---------- */
  .tree{ border:1px solid var(--border); border-radius:12px; background:var(--surface); margin-bottom:8px; box-shadow:var(--shadow); }
  .tree + .tree{margin-top:8px;}
  .tree summary{ cursor:pointer; list-style:none; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:0.95rem; color:var(--ink); }
  .tree summary::-webkit-details-marker{display:none;}
  .tree summary::before{ content:"▸"; color:var(--accent); font-size:0.8em; margin-right:8px; transition:transform .15s ease; display:inline-block; }
  .tree[open] > summary::before{transform:rotate(90deg);}
  .tree summary .count{ font-size:0.7rem; color:var(--ink-faint); font-weight:500; white-space:nowrap; }
  .tree .items{ margin:0; padding:2px 18px 14px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 18px; border-top:1px solid var(--border); }
  .tree .items li{ font-size:0.88rem; color:var(--ink-soft); padding:3px 0; }
  .tree .items li::marker{color:var(--accent);}
  mark{background:var(--accent-soft); color:var(--accent-ink); border-radius:2px; padding:0 2px;}

  /* ---------- Matrix table ---------- */
  .table-wrap{overflow-x:auto; border-top:1px solid var(--border);}
  table.matrix{width:100%; min-width:1240px; border-collapse:collapse; font-size:0.8rem;}
  table.matrix thead th{ text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface); }
  table.matrix tbody td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--ink-soft);}
  table.matrix tbody tr:last-child td{border-bottom:none;}
  table.matrix tbody td:first-child{color:var(--ink); font-weight:600; font-family:var(--font-display); font-size:0.85rem; min-width:15ch;}
  table.matrix tbody tr:hover td{background:var(--surface-2);}
  table.matrix td.num{font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink); font-weight:500;}
  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
  .pill-critico{background:var(--accent); color:var(--accent-ink);}
  .pill-alta{background:var(--accent-soft); color:var(--accent);}
  .pill-media{background:var(--gold-soft); color:var(--gold);}
  .pill-baixa{background:transparent; color:var(--ink-faint); border:1px solid var(--border);}
  tr.hidden-by-search{display:none !important;}

  /* ---------- Phase sections (data model / architecture) ---------- */
  .phase-head{ display:flex; gap:14px; align-items:baseline; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:14px; }
  .phase-badge{ font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-ink); background:var(--accent); padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .phase-head h2{font-size:clamp(1.2rem,2.2vw,1.5rem);}
  .diagram-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; margin:16px 0; overflow-x:auto; box-shadow:var(--shadow); }
  .entity-note{font-size:0.85rem; color:var(--ink-faint); margin-top:6px;}
  .nav-card{ border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:14px 16px; margin-bottom:10px; }
  .nav-card h4{font-size:0.8rem; font-weight:700; color:var(--accent); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.02em;}
  .nav-card p{font-size:0.88rem; color:var(--ink-soft); margin:0;}

  /* ---------- Example card ---------- */
  .example{ margin:20px 0 28px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow); }
  .example-head{ background:var(--accent-soft); padding:12px 18px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .example-head .tag{ font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); }
  .example-head h3{font-size:1.05rem; color:var(--accent);}
  .example-body{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:0; }
  .field{ padding:12px 16px; border-top:1px solid var(--border); border-left:1px solid var(--border); }
  .example-body .field:nth-child(-n+3){border-top:none;}
  .field:nth-child(3n+1){border-left:none;}
  .field dt{ font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); margin-bottom:4px; }
  .field dd{margin:0; font-size:0.87rem; color:var(--ink); line-height:1.5;}
  .field dd .num{font-variant-numeric:tabular-nums; font-weight:700;}

  /* ---------- Closing ---------- */
  .closing{ border:1px solid var(--border); border-radius:12px; padding:26px 28px; background:var(--surface); box-shadow:var(--shadow); }
  .closing h2{font-size:1.2rem; margin-bottom:10px;}
  .closing ol{margin:14px 0 0; padding-left:1.2em;}
  .closing li{margin-bottom:8px; font-size:0.95rem;}
  .closing li b{color:var(--accent);}
  .note{ font-size:0.85rem; color:var(--ink-faint); margin-top:18px; border-top:1px solid var(--border); padding-top:14px; }
  ::selection{background:var(--accent-soft);}

  /* ---------- Login (acesso restrito) ---------- */
  .login-wrap { max-width: 360px; margin: 6rem auto; padding: 0 1.5rem; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.6rem; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  .login-card .sub { color: var(--ink-faint); font-size: .85rem; margin-bottom: 1.4rem; }
  .login-card label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin-bottom: .4rem; }
  .login-card input[type="password"] { width: 100%; padding: .65rem .7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--ink); font-family: inherit; font-size: .95rem; }
  .login-card button { cursor: pointer; border: none; border-radius: 8px; padding: .7rem 1.1rem; font-family: inherit; font-weight: 700; font-size: .9rem; background: var(--accent); color: var(--accent-ink); margin-top: 1.1rem; width: 100%; }
  .login-card .msg { margin-top: 1rem; font-size: .85rem; padding: .65rem .85rem; border-radius: 8px; background: #f7e3de; color: #b3432f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-card .msg { background: #3a231d; color: #e08a72; } }
  :root[data-theme="dark"] .login-card .msg { background: #3a231d; color: #e08a72; }
</style>
</head>
<body>

<div class="login-wrap">
  <div id="login" class="login-card">
    <h1>🦷 GestOdonto</h1>
    <div class="sub">Mapa de marketing interno — acesso restrito aos sócios.</div>
    <label for="pwd">Senha</label>
    <input type="password" id="pwd" placeholder="••••••••">
    <button id="loginBtn">Entrar</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="content" style="display:none"></div>

<script>
(function () {
  var TOKEN_KEY = 'gestodonto_admin_token';
  var loginWrapEl = document.querySelector('.login-wrap');
  var contentEl = document.getElementById('content');
  var pwdEl = document.getElementById('pwd');
  var loginMsgEl = document.getElementById('loginMsg');

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  function showLogin(msg) {
    loginWrapEl.style.display = 'block';
    contentEl.style.display = 'none';
    loginMsgEl.innerHTML = msg ? ('<div class="msg">' + msg + '</div>') : '';
  }

  function renderMermaidWhenReady(tries) {
    tries = tries || 0;
    if (window.mermaid) { window.mermaid.run({ querySelector: '.mermaid' }); return; }
    if (tries > 40) return;
    setTimeout(function () { renderMermaidWhenReady(tries + 1); }, 75);
  }

  function initSearch() {
    var search = document.getElementById('search');
    if (!search) return;
    var trees = Array.prototype.slice.call(document.querySelectorAll('.tree'));
    function rowsOf(tree) {
      return Array.prototype.slice.call(tree.querySelectorAll('table.matrix tbody tr, ul.items li'));
    }
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      trees.forEach(function (tree) {
        var rows = rowsOf(tree);
        var summaryText = tree.querySelector('summary').textContent.toLowerCase();
        if (!q) {
          rows.forEach(function (row) { row.classList.remove('hidden-by-search'); });
          tree.classList.remove('hidden-by-search');
          return;
        }
        var anyMatch = summaryText.indexOf(q) !== -1;
        rows.forEach(function (row) {
          var match = row.textContent.toLowerCase().indexOf(q) !== -1;
          row.classList.toggle('hidden-by-search', !match);
          if (match) anyMatch = true;
        });
        tree.classList.toggle('hidden-by-search', !anyMatch);
        if (anyMatch) tree.open = true;
      });
    });
  }

  function boot() {
    var token = getToken();
    if (!token) { showLogin(); return; }
    fetch('/api/mapa-marketing-content', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { clearToken(); throw new Error('Sessão expirada ou inválida. Faça login novamente.'); }
        return r.text();
      })
      .then(function (html) {
        contentEl.innerHTML = html;
        loginWrapEl.style.display = 'none';
        contentEl.style.display = 'block';
        initSearch();
        renderMermaidWhenReady();
      })
      .catch(function (e) { showLogin(e.message); });
  }

  document.getElementById('loginBtn').addEventListener('click', function () {
    var password = pwdEl.value;
    loginMsgEl.innerHTML = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || 'Falha no login.');
        setToken(result.data.token);
        boot();
      })
      .catch(function (e) { loginMsgEl.innerHTML = '<div class="msg">' + e.message + '</div>'; });
  });

  pwdEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  boot();
})();
</script>
</body>
</html>
